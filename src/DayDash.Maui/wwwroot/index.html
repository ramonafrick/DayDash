<!DOCTYPE html>
<html lang="de-CH">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>DayDash</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="_content/DayDash.Modules.Settings/css/app.css" />
    <link rel="stylesheet" href="_content/DayDash.Modules.Settings/css/daydash-globals.css" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="DayDash.Maui.styles.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Laden…</div>

    <div id="blazor-error-ui" data-nosnippet>
        <span class="reload-text">Ein Fehler ist aufgetreten.</span>
        <a href="." class="reload">Neu laden</a>
        <span class="dismiss">🗙</span>
    </div>

    <script>
        // Static shell text can't use IStringLocalizer; swap to English when that's the stored culture.
        (function () {
            try {
                if ((localStorage.getItem('BlazorCulture') || 'de-CH').toLowerCase().startsWith('en')) {
                    document.querySelector('#app').textContent = 'Loading…';
                    document.querySelector('#blazor-error-ui .reload-text').textContent = 'An error has occurred.';
                    document.querySelector('#blazor-error-ui .reload').textContent = 'Reload';
                }
            } catch (e) { /* localStorage unavailable - keep the de-CH default */ }
        })();
    </script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
